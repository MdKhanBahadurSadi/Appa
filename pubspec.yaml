name: appa_pdf
description: A modern, eye-catching PDF reader application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # iOS style icons
  cupertino_icons: ^1.0.6

  # Pick PDF files from device storage
  file_picker: ^8.0.0

  # View PDF files (Android / iOS)
  flutter_pdfview: ^1.3.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Lottie animations
  lottie: ^3.1.0

  # Advanced animations
  flutter_animate: ^4.5.0

  # New dependencies
  cunning_document_scanner: ^1.1.3
  pdf: ^3.10.8
  google_generative_ai: ^0.4.3
  shared_preferences: ^2.2.3
  share_plus: ^10.0.0
  printing: ^5.13.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  path: ^1.9.0
  syncfusion_flutter_pdf: ^27.1.48

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/app.png
